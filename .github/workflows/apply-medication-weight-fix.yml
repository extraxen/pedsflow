name: Apply medication weight calculator fix

on:
  push:
    branches:
      - fix/medication-dose-weight

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/medication-dose-weight

      - name: Apply source changes
        run: python .github/scripts/apply_medication_weight_fix.py

      - name: Commit generated changes
        run: |
          git config user.name "PedsFlow maintenance"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply generated medication weight changes"
          git push origin HEAD:fix/medication-dose-weight
